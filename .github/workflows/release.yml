name: Release

# Publishes the version in package.json to npm, then tags it v<version> and
# makes a GitHub release. Run it from the Actions tab (or the API) after the
# version bump is merged; pushing a tag v<version> by hand also runs it.
# npm authorizes this workflow by trusted publishing (OIDC), so no token is
# stored here.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Read the version
        id: version
        run: echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Check the tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$TAG" = "$GITHUB_REF_NAME"
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG is already released; bump the version in package.json" >&2
            exit 1
          fi
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: npm publish --provenance --access public
      - name: Tag and make a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
