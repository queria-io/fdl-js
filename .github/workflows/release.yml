name: Release

# Every push to main is checked, and published when its commits call for a
# release: semantic-release reads the Conventional Commits since the last tag
# (fix -> patch, feat -> minor, a breaking change, `!` or a BREAKING CHANGE
# footer -> minor; going to 1.0 needs a change to the release rules),
# tags it v<version> and makes a GitHub release, then stages that version on
# npm. A staged version goes live only after a maintainer approves it on
# npmjs.com (or with `npm stage approve`) with 2FA.
# The version in package.json is not kept in the repository; the tags are.
# npm authorizes this workflow by trusted publishing (OIDC), so no token is
# stored here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      # The conventionalcommits preset reads `!` in the header as a breaking
      # change; the default angular preset does not parse such headers at all.
      - run: npx --yes -p semantic-release@25.0.9 -p conventional-changelog-conventionalcommits@9.3.1 semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Stage on npm
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$version" = "0.0.0-semantic-release" ]; then
            echo "No new release"
            exit 0
          fi
          npx --yes npm@12.2.2 stage publish
