name: Release

# Every push to main is checked, and published when its commits call for a
# release: semantic-release reads the Conventional Commits since the last tag
# (fix -> patch, feat -> minor, a breaking change -> minor while below 1.0),
# publishes that version to npm, tags it v<version> and makes a GitHub release.
# The version in package.json is not kept in the repository; the tags are.
# npm authorizes this workflow by trusted publishing (OIDC), so no token is
# stored here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: npx --yes semantic-release@25.0.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
