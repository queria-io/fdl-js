name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The conformance suite of the specification (queria-io/fdl, conformance/)
      - uses: actions/checkout@v5
        with:
          repository: queria-io/fdl
          path: fdl
      - run: python3 fdl/conformance/run.py -- node conformance/reader.mjs
